<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>BitReef | 正在跳转</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      place-items: center;
      color: #182542;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background: #fbfcff;
    }

    .ambient,
    .ambient::before,
    .ambient::after,
    .orbit,
    .orbit::before,
    .orbit::after {
      position: fixed;
      pointer-events: none;
    }

    .ambient { inset: 0; overflow: hidden; }

    .ambient::before,
    .ambient::after {
      width: 58vmax;
      height: 58vmax;
      content: "";
      border-radius: 50%;
      filter: blur(28px);
    }

    .ambient::before {
      top: -38vmax;
      left: -21vmax;
      opacity: .8;
      background: radial-gradient(circle, rgba(85, 142, 255, .18), rgba(85, 142, 255, 0) 67%);
      animation: drift-one 14s ease-in-out infinite alternate;
    }

    .ambient::after {
      right: -25vmax;
      bottom: -42vmax;
      opacity: .75;
      background: radial-gradient(circle, rgba(135, 97, 239, .14), rgba(135, 97, 239, 0) 68%);
      animation: drift-two 17s ease-in-out infinite alternate;
    }

    .orbit {
      top: 50%;
      left: 50%;
      width: min(72vw, 900px);
      height: min(72vw, 900px);
      border: 1px solid rgba(77, 115, 204, .075);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: orbit 30s linear infinite;
    }

    .orbit::before,
    .orbit::after {
      width: 6px;
      height: 6px;
      content: "";
      border-radius: 50%;
      background: #4f7cf0;
      box-shadow: 0 0 0 5px rgba(79, 124, 240, .1), 0 0 17px rgba(79, 124, 240, .42);
    }

    .orbit::before { top: 14%; left: 10%; }
    .orbit::after {
      right: 9%;
      bottom: 17%;
      background: #956ee8;
      box-shadow: 0 0 0 5px rgba(149, 110, 232, .1), 0 0 17px rgba(149, 110, 232, .38);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(430px, calc(100% - 48px));
      padding: 28px 8px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 30px);
      font-weight: 650;
      line-height: 1.35;
      letter-spacing: 0;
    }

    p {
      margin: 12px 0 0;
      color: #71809d;
      font-size: 14px;
      line-height: 1.75;
    }

    .destination {
      display: inline;
      margin-left: 5px;
      overflow-wrap: break-word;
      color: #396bdb;
      font-size: 13px;
      font-weight: 600;
    }

    .progress {
      width: 72px;
      height: 2px;
      margin: 27px auto 0;
      overflow: hidden;
      background: #dfe6f5;
    }

    .progress::before {
      display: block;
      width: 42%;
      height: 100%;
      content: "";
      background: #4776eb;
      box-shadow: 0 0 9px rgba(71, 118, 235, .5);
      animation: sweep 1.15s ease-in-out infinite;
    }

    @keyframes orbit {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes sweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(270%); }
    }

    @keyframes drift-one {
      to { transform: translate(12vmax, 9vmax) scale(1.05); }
    }

    @keyframes drift-two {
      to { transform: translate(-9vmax, -9vmax) scale(.93); }
    }

    @media (max-width: 500px) {
      main { width: min(100% - 32px, 430px); }
      .orbit { width: 118vw; height: 118vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="orbit" aria-hidden="true"></div>
  <main aria-live="assertive">
    <h1 id="title">连接最佳线路</h1>
    <p id="message">为了确保流畅体验，正在优选出最佳可用节点，请稍候。</p>
    <div class="progress" aria-hidden="true"></div>
  </main>

  <script>
    const lines = [
      { name: "主线路", url: "https://ai.bitreef.cc", pingUrl: "https://ai.bitreef.cc/api/status" },
      { name: "备用线路", url: "https://ai.kbai.net", pingUrl: "https://ai.kbai.net/api/status" }
    ];
    const CHECK_TIMEOUT = 5000;
    const REDIRECT_DELAY = 2000;
    const title = document.getElementById("title");
    const message = document.getElementById("message");

    function checkLine(line) {
      return new Promise((resolve) => {
        const image = new Image();
        const startedAt = performance.now();
        let finished = false;
        const finish = (available) => {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          resolve({ line, available, latency: performance.now() - startedAt });
        };
        const timeout = setTimeout(() => finish(false), CHECK_TIMEOUT);
        image.onload = () => finish(true);
        image.onerror = () => finish(true);
        image.src = `${line.pingUrl}${line.pingUrl.includes("?") ? "&" : "?"}_=${Date.now()}`;
      });
    }

    function showRedirect(selected) {
      title.textContent = "即将为您跳转";
      message.innerHTML = `正在跳转至${selected.name}<span class="destination">${selected.url}</span>`;
      window.setTimeout(() => window.location.replace(selected.url), REDIRECT_DELAY);
    }

    async function redirect() {
      const results = await Promise.all(lines.map(checkLine));
      const available = results.filter((result) => result.available);
      const selected = (available.length ? available : results)
        .sort((a, b) => a.latency - b.latency)[0].line;
      showRedirect(selected);
    }

    redirect().catch(() => showRedirect(lines[0]));
  </script>
</body>
</html>
