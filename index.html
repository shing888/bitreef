  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "BitReef API",
      "alternateName": "比特礁API",
      "inLanguage": "zh-CN",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "description": "BitReef API（比特礁API）聚合全球顶尖 AI 模型，一个 Key 可接入多种模型，兼容 OpenAI API，支持统一调用、稳定路由与实时用量查询。",
      "publisher": {
        "@type": "Organization",
        "name": "BitReef API",
        "logo": "https://s1.img-e.com/20260717/6a5a16a493c7f.png"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #17243e;
      --muted: #6d7c99;
      --blue: #365fb9;
      --line: rgba(82, 113, 172, .25);
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      place-items: center;
      color: var(--ink);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background: #f7f9ff;
    }

    .cinema,
    .cinema::before,
    .cinema::after,
    .mist,
    .arc,
    .arc::before,
    .arc::after { position: fixed; pointer-events: none; }

    .cinema {
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse 55% 64% at 50% 48%, rgba(144, 175, 237, .24) 0%, rgba(240, 245, 255, .2) 47%, transparent 72%),
        linear-gradient(125deg, #fbfcff 0%, #f3f6fc 46%, #f9fbff 100%);
    }

    .cinema::before {
      inset: -30%;
      content: "";
      opacity: .6;
      background: linear-gradient(112deg, transparent 44%, rgba(74, 126, 230, .1) 49%, transparent 56%);
      transform: rotate(-13deg);
      animation: beam 12s ease-in-out infinite alternate;
    }

    .cinema::after {
      inset: 0;
      content: "";
      opacity: .17;
      background-image: radial-gradient(rgba(50, 77, 132, .64) .5px, transparent .7px);
      background-size: 4px 4px;
      mix-blend-mode: soft-light;
    }

    .mist {
      width: 56vmax;
      height: 38vmax;
      border-radius: 50%;
      filter: blur(58px);
      opacity: .38;
    }

    .mist-one {
      top: -20vmax;
      left: -24vmax;
      background: #80a7ed;
      animation: float-one 18s ease-in-out infinite alternate;
    }

    .mist-two {
      right: -26vmax;
      bottom: -23vmax;
      background: #af97eb;
      animation: float-two 21s ease-in-out infinite alternate;
    }

    .arc {
      top: 50%;
      left: 50%;
      width: min(1120px, 110vw);
      height: min(1120px, 110vw);
      border: 1px solid rgba(75, 110, 182, .13);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: orbit 38s linear infinite;
    }

    .arc::before,
    .arc::after {
      width: 5px;
      height: 5px;
      content: "";
      border-radius: 50%;
      background: #4777da;
      box-shadow: 0 0 0 5px rgba(71, 119, 218, .1), 0 0 26px 4px rgba(71, 119, 218, .35);
    }

    .arc::before { top: 16%; left: 9%; }
    .arc::after {
      right: 11%;
      bottom: 15%;
      background: #8c6ed5;
      box-shadow: 0 0 0 5px rgba(140, 110, 213, .08), 0 0 26px 4px rgba(140, 110, 213, .3);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(760px, calc(100% - 48px));
      padding: 52px 12px;
      text-align: center;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 26px;
      color: #6178aa;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.2px;
    }

    .kicker::before,
    .kicker::after {
      width: 24px;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, rgba(87, 119, 187, .55));
    }

    .kicker::after { transform: rotate(180deg); }

    h1 {
      max-width: 680px;
      margin: 0 auto;
      color: transparent;
      font-size: clamp(34px, 5vw, 58px);
      font-weight: 620;
      line-height: 1.2;
      letter-spacing: .025em;
      text-wrap: balance;
      background: linear-gradient(110deg, #172846 12%, #263f70 50%, #486399 92%);
      background-clip: text;
      -webkit-background-clip: text;
      text-shadow: 0 12px 35px rgba(83, 115, 176, .12);
    }

    .message {
      max-width: 580px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .destination {
      display: inline;
      margin-left: 7px;
      overflow-wrap: break-word;
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
    }

    .progress {
      position: relative;
      width: min(150px, 44vw);
      height: 1px;
      margin: 37px auto 0;
      overflow: hidden;
      background: var(--line);
    }

    .progress::before {
      display: block;
      width: 38%;
      height: 100%;
      content: "";
      background: #4776da;
      box-shadow: 0 0 15px 3px rgba(79, 119, 210, .5);
      animation: sweep 1.5s cubic-bezier(.5, 0, .4, 1) infinite;
    }

    @keyframes orbit { to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes sweep { from { transform: translateX(-130%); } to { transform: translateX(300%); } }
    @keyframes beam { to { transform: rotate(-13deg) translate(15%, 5%); } }
    @keyframes float-one { to { transform: translate(15vmax, 11vmax) scale(1.12); } }
    @keyframes float-two { to { transform: translate(-13vmax, -9vmax) scale(.9); } }

    @media (max-width: 560px) {
      main { width: min(100% - 34px, 760px); padding: 36px 0; }
      .kicker { margin-bottom: 22px; letter-spacing: 1.8px; }
      h1 { font-size: 34px; }
      .message { margin-top: 18px; font-size: 14px; }
      .arc { width: 142vw; height: 142vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="cinema" aria-hidden="true">
    <div class="mist mist-one"></div>
    <div class="mist mist-two"></div>
  </div>
  <div class="arc" aria-hidden="true"></div>
  <main aria-live="assertive">
    <p class="kicker">BITREEF API</p>
    <h1 id="title">正在连接最佳线路</h1>
    <p class="message" id="message">为了确保流畅体验，正在为您优选可用节点，请稍候。</p>
    <div class="progress" aria-hidden="true"></div>
    <noscript>
      <p class="message">BitReef API（比特礁API）需要启用 JavaScript 才能自动选择访问线路。您也可以访问 <a href="https://ai.bitreef.cc">主线路</a> 或 <a href="https://ai.kbai.net">备用线路</a>。</p>
    </noscript>
  </main>

  <script>
    const lines = [
      { name: "主线路", url: "https://ai.bitreef.cc", pingUrl: "https://ai.bitreef.cc/api/status" },
      { name: "备用线路", url: "https://ai.kbai.net", pingUrl: "https://ai.kbai.net/api/status" }
    ];
    const CHECK_TIMEOUT = 5000;
    const REDIRECT_DELAY = 2000;
    const title = document.getElementById("title");
    const message = document.getElementById("message");

    function checkLine(line) {
      return new Promise((resolve) => {
        const image = new Image();
        const startedAt = performance.now();
        let finished = false;
        const finish = (available) => {
          if (finished) return;
          finished = true;
          clearTimeout(timeout);
          resolve({ line, available, latency: performance.now() - startedAt });
        };
        const timeout = setTimeout(() => finish(false), CHECK_TIMEOUT);
        image.onload = () => finish(true);
        image.onerror = () => finish(true);
        image.src = `${line.pingUrl}${line.pingUrl.includes("?") ? "&" : "?"}_=${Date.now()}`;
      });
    }

    function showRedirect(selected) {
      title.textContent = "即将为您跳转";
      message.innerHTML = `正在跳转至${selected.name}<span class="destination">${selected.url}</span>`;
      window.setTimeout(() => window.location.replace(selected.url), REDIRECT_DELAY);
    }

    async function redirect() {
      const results = await Promise.all(lines.map(checkLine));
      const available = results.filter((result) => result.available);
      const selected = (available.length ? available : results)
        .sort((a, b) => a.latency - b.latency)[0].line;
      showRedirect(selected);
    }

    redirect().catch(() => showRedirect(lines[0]));
  </script>
</body>
</html>
